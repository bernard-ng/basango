services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./var/volumes/postgres:/var/lib/postgresql/data
    networks:
      - basango_network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./var/volumes/redis:/data
    networks:
      - basango_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - basango_network

  adminer:
    image: adminer:latest
    depends_on:
      - postgres
    environment:
      APP_ENV: dev
      ADMINER_DESIGN: pepa-linha
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"
    networks:
      - basango_network

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - basango_network

networks:
  basango_network:

volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./var/volumes/redis
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./var/volumes/postgres
